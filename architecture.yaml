# Machine-checked subset: scripts/check-architecture.ts mechanically verifies
# browser_interop.forbidden_modules and dynamic_types for the TypeScript
# reference engine. It also verifies that the F# product-site engine contains
# no browser/JS interop authority and that its tiny C# WASM host remains a
# direct marshalling shim. Everything else in this file (state.*, federation.*,
# effects.representation, capabilities.ambient_authority) is enforced by types,
# tests and review, not by this YAML declaration alone.
architecture:
  authoritative_state:
    owner: engine/domain
    mutation: transitions_only
  browser_interop:
    allowed_modules: [kernel]
    forbidden_modules: [engine]
  dynamic_types:
    allowed_modules: [kernel]
  effects:
    representation: explicit
    external_outcomes: [success, failure, cancelled, outcome_unknown]
  capabilities:
    ambient_authority: forbidden
  state:
    string_discriminators: forbidden
    exhaustive_matching: required

  federation:
    module_state_ownership: local
    cross_module_mutation: forbidden
    boundary: versioned_serializable_envelopes
    coordinator_domain_authority: forbidden
    lifecycle: [load, initialize, restore, active, suspend, snapshot, unload]
    untargeted_message_kinds: [domain_event]
    transport_failure_state: faulted
    automatic_retry: forbidden
    partial_startup:
      independent_modules_may_continue: true
      unavailable_dependents_must_remain_unloaded: true
    diagnostics:
      domain_payloads: forbidden
      raw_transport_errors: forbidden
    proof:
      independent_fsharp_wasm_modules: 2
      distinct_runtime_ids_required: true
      typed_receiver_decode_required: true
      real_browser_gate: scripts/smoke-site-wasm.sh
