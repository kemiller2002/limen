# Machine-checked subset: scripts/check-architecture.ts mechanically verifies
# browser_interop.forbidden_modules and dynamic_types for the TypeScript
# reference engine. It also verifies that the F# product-site engine contains
# no browser/JS interop authority and that its tiny C# WASM host remains a
# direct marshalling shim. Everything else in this file (state.*, federation.*,
# effects.representation, capabilities.ambient_authority) is enforced by types,
# tests and review, not by this YAML declaration alone.
# contract.* is machine-checked by `npm run contract:check` (generated bindings
# byte-identical to what the contract produces) and by test/handshake.test.ts
# (no view or effect is applied before the handshake verdict).
# core.* points at architecture/core.json, the machine-readable Core manifest
# (kemiller2002/limen#60), which scripts/check-architecture.ts reads and
# enforces through tools/guardrails/core.ts: exact Core files, every runtime
# file in exactly one layer, Core importing only Core, optional layers
# importing only public Core files, six binding primitives, four built-in
# capability families, zero runtime dependencies, approved root export
# families, seven canonical concepts.
architecture:
  core:
    manifest: architecture/core.json
    version: 1.0.0
    layers: [core-contract, core-kernel]
    optional_groups: [package-facade, reference-demo, federation, capability-packs, hosts-renderers, tooling-conformance]
    core_imports_optional: forbidden
    optional_imports_private_core: forbidden
    unclassified_runtime_path: forbidden
    binding_primitives: 6
    builtin_capability_families: 4
    runtime_dependencies: 0
    canonical_concepts: 7
    growth: core_admission_required
  contract:
    source_of_truth: contract/core.contract.json
    generated_bindings_read_only: true
    generator: tools/contract-gen
    fingerprint: sha256(canonical-json-without-doc)
    handshake_before_normal_traffic: required
    incompatibility_is_not_an_effect_outcome: true
    optional_capabilities:
      envelope: generic   # EffectRequest.Capability / CapabilityResult / CapabilityFact
      core_knows_capability_semantics: forbidden
      unnegotiated_request_outcome: Unsupported
  authoritative_state:
    owner: engine/domain
    mutation: transitions_only
  browser_interop:
    allowed_modules: [kernel]
    forbidden_modules: [engine]
  dynamic_types:
    allowed_modules: [kernel]
  effects:
    representation: explicit
    external_outcomes: [success, failure, cancelled, outcome_unknown]
  capabilities:
    ambient_authority: forbidden
  state:
    string_discriminators: forbidden
    exhaustive_matching: required

  federation:
    module_state_ownership: local
    cross_module_mutation: forbidden
    boundary: versioned_serializable_envelopes
    coordinator_domain_authority: forbidden
    lifecycle: [load, initialize, restore, active, suspend, snapshot, unload]
    untargeted_message_kinds: [domain_event]
    transport_failure_state: faulted
    automatic_retry: forbidden
    partial_startup:
      independent_modules_may_continue: true
      unavailable_dependents_must_remain_unloaded: true
    diagnostics:
      domain_payloads: forbidden
      raw_transport_errors: forbidden
    proof:
      independent_fsharp_wasm_modules: 2
      distinct_runtime_ids_required: true
      typed_receiver_decode_required: true
      real_browser_gate: scripts/smoke-site-wasm.sh
