[package]
name = "limen-minimal"
version = "0.1.0"
edition = "2021"
description = "The minimal engine (conformance/sessions/minimal-engine.md) in Rust. Application meaning only; the WASM ABI lives in limen-minimal-wasm."
license = "MIT"
publish = false

[dependencies]
limen-contract = { path = "../../../rust/limen-contract" }
limen-guest = { path = "../../../rust/limen-guest" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
