[package]
name = "limen-contract"
version = "0.1.0"
edition = "2021"
description = "Generated Rust bindings for the language-neutral Limen contract. Do not edit src/runtime.rs or src/limen_*.rs: they are generated by tools/contract-gen."
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The one dependency: a JSON value model for the generated decoders. The npm
# package's zero-runtime-dependency rule governs the browser host, not guests.
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[dev-dependencies]
# Test-only: recompute the contract fingerprint independently of the generator.
sha2 = "0.10"
