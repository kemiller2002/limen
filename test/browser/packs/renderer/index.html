<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-text="title">Catalogue</title>
  <meta name="description" data-bind-content="description" content="Everything we sell.">
  <meta name="robots" data-bind-content="robots" content="index">
  <link rel="canonical" data-bind-href="canonical" href="http://shop.test/">
</head>
<body>
  <main>
    <h1 data-text="heading">Catalogue</h1>
    <p id="status" data-text="status"></p>
    <template data-if="showList">
      <ul id="items">
        <template data-each="items" data-key="id">
          <li><a data-bind-href="href" data-text="name">item</a> <span data-text="price">0</span></li>
        </template>
      </ul>
    </template><ul id="items" data-limen-if="showList">
        <template data-each="items" data-key="id">
          <li><a data-bind-href="href" data-text="name">item</a> <span data-text="price">0</span></li>
        </template><li data-limen-key="kettle"><a data-bind-href="href" data-text="name" href="/items/kettle">Kettle</a> <span data-text="price">£24.50</span></li><li data-limen-key="teapot"><a data-bind-href="href" data-text="name" href="/items/teapot">Teapot</a> <span data-text="price">£18.00</span></li><li data-limen-key="cups"><a data-bind-href="href" data-text="name" href="/items/cups">Cups &amp; saucers</a> <span data-text="price">£12.25</span></li>
      </ul>
    <template data-if="showDetail">
      <article id="detail">
        <h2 data-text="detailName">name</h2>
        <p data-text="detailText">text</p>
        <a id="back" href="/">All items</a>
      </article>
    </template>
    <p id="recent" data-text="recent">No recently viewed items.</p>
    <section id="stock" data-client-only>
      <p>Live stock levels appear once the page is running.</p>
    </section>
    <button type="button" data-event="refresh">Refresh</button>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
