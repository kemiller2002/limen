<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limen media pack in a real browser</title>
</head>
<body>
  <!-- Run by scripts/smoke-packs.ts in Chromium with its fake camera and
       microphone, under a strict CSP with Trusted Types. main.js drives
       capture, preview and recording through the real kernel. -->
  <video data-media-preview="self" width="320" height="240" playsinline></video>
  <button id="poke" data-event="poke">Ask</button>
  <script type="module" src="./main.js"></script>
</body>
</html>
