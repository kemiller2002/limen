<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limen offline reference in a real browser</title>
</head>
<body>
  <!-- Run by scripts/smoke-packs.ts under a strict CSP whose Trusted Types
       allow one policy, limen-offline, which vouches only for this page's
       service worker. main.js is the page's engine: it registers the worker,
       queues work offline, reloads with no network, reconciles its outbox
       when the network returns, and takes an update when it chooses to. -->
  <button id="poke" data-event="poke">Ask</button>
  <p id="status" data-text="status"></p>
  <script type="module" src="./main.js"></script>
</body>
</html>
