<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limen files pack in a real browser</title>
</head>
<body>
  <!-- Run by scripts/smoke-packs.ts under a strict CSP with Trusted Types.
       main.js drives the scenarios and reports window.__limenPackResult. -->
  <label>Avatar <input id="avatar" type="file" data-files-input="avatar"></label>
  <label>Attachments <input id="attachments" type="file" multiple data-files-input="attachments"></label>
  <label>Never used <input id="fresh" type="file" data-files-input="fresh"></label>
  <button id="poke" data-event="poke">Ask (no gesture)</button>
  <button id="choose" data-event="choose">Choose a file…</button>
  <script type="module" src="./main.js"></script>
</body>
</html>
