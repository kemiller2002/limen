<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limen transfer profile in a real browser</title>
</head>
<body>
  <!-- Run by scripts/smoke-packs.ts under a strict CSP (connect-src 'self')
       with Trusted Types. main.js picks a real file with the files pack and
       uploads it with the transfer pack against the runner's endpoints. -->
  <input id="doc" type="file" data-files-input="doc">
  <button id="poke" data-event="poke">Ask</button>
  <script type="module" src="./main.js"></script>
</body>
</html>
