name: CI

concurrency:
  # Same key for a branch's push event and its PR's synchronize event (the
  # PR event's own sha is a synthetic merge commit, so use its head sha
  # instead) — this cancels the redundant duplicate rather than running both.
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs, in order: build → build:examples → check:architecture →
      # check:docs → all tests (kernel, domain, and example verification).
      - name: Build and test
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run
