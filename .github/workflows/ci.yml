name: CI

concurrency:
  # Same key for a branch's push event and its PR's synchronize event (the
  # PR event's own sha is a synthetic merge commit, so use its head sha
  # instead) — this cancels the redundant duplicate rather than running both.
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lifecycle CLI is F#. `npm pack` builds it through prepack, so the
      # SDK is required even for the package-contents check below.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      # The F# core: the lifecycle rules themselves, tested without a CLI or a
      # package in the way.
      - name: Test the lifecycle core
        run: npm run test:cli

      # Build the CLI for this platform so the packaged-surface tests in
      # test/cli.test.ts run for real rather than reporting as skipped.
      - name: Build the lifecycle CLI
        run: npm run build:cli

      # Runs, in order: build → build:examples → build:site →
      # check:architecture → check:docs → check:site → all tests (kernel,
      # domain, example, site and CLI verification).
      - name: Build and test
        run: npm run check

      - name: Smoke-test the F# WebAssembly site in real Chrome
        run: npm run smoke:site:wasm

      - name: Verify package contents
        run: npm pack --dry-run

      # The strongest protection against publishing a package that cannot be
      # used: pack it, install it into an empty project, and build the
      # documented minimal example against the INSTALLED copy. Everything above
      # this line tests the source tree, which resolves imports a consumer
      # cannot.
      - name: Clean-room install of the packed tarball
        run: npm run check:clean-room

  # The npm package ships a binary per platform, so the launcher has to be
  # exercised on each of them. Testing only Linux would leave the Windows and
  # macOS paths — different executable name, different permissions — unproven.
  packaged-cli:
    name: Packaged CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build the lifecycle CLI for this platform
        run: npm run build:cli

      - name: Exercise the CLI through the npm bootstrap
        run: node --experimental-strip-types --test test/cli.test.ts

  echelon-capability-rollout:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: |
          git fetch origin main
          git checkout origin/main -- ".github/workflows/ci.yml"
      - name: SDE
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/state-directed-engineering.git "$RUNNER_TEMP/sde-source"
          (cd "$RUNNER_TEMP/sde-source/distribution" && npm run build:payload)
          if [[ -d .sde || -f .echelon/sde.json ]]; then cmd=upgrade; else cmd=init; fi
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- "$cmd"
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
      - name: ROS
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/repository-operating-system.git "$RUNNER_TEMP/ros-source"
          if [[ -f .echelon/ros.json ]]; then
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          elif [[ -f .ros/installation.json ]]; then
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- upgrade
          else
            dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          fi
      - name: Visual Engineering
        run: |
          set -euo pipefail
          if [[ -f .echelon/visual-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/visual-engineering@1.0.0 "$cmd"
      - name: Communication Engineering
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kemiller2002/communication-engineering.git "$RUNNER_TEMP/communication-engineering-source"
          if [[ -f .echelon/communication-engineering.json ]]; then cmd=upgrade; else cmd=init; fi
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" "$cmd"
      - name: Limen
        run: |
          set -euo pipefail
          if [[ ! -f limen.config.json ]]; then
            printf '%s\n' '{"configurationVersion":1,"boundary":{"engine":["src/engine"],"kernel":["src/kernel"]}}' > limen.config.json
          fi
          if [[ -f .echelon/limen.json ]]; then cmd=upgrade; else cmd=init; fi
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 "$cmd"
      - name: Verify combined state
        run: |
          set -euo pipefail
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- init
          dotnet run --project "$RUNNER_TEMP/ros-source/src/Ros.Cli/Ros.Cli.fsproj" -c Release -- verify --strict
          SDE_PAYLOAD_DIR="$RUNNER_TEMP/sde-source/distribution/dist" dotnet run --project "$RUNNER_TEMP/sde-source/src/Sde.Cli/Sde.Cli.fsproj" -c Release -- verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          node "$RUNNER_TEMP/communication-engineering-source/bin/communication-engineering.mjs" verify --strict
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.1 verify --strict
      - name: Commit non-workflow rollout state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows
          git rm --ignore-unmatch .echelon-rollout-trigger
          git add -A
          git reset .github/workflows
          if git diff --cached --quiet; then
            echo "No non-workflow repository changes required."
            exit 0
          fi
          git commit -m "chore: install current Echelon engineering capabilities"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
