# Installed and maintained by Limen (@echelon-foundry/typescript-wasm-kernel).
# Edit freely — once changed, `limen upgrade` will stop rewriting it and will
# tell you what the current tool-owned version would have been.
name: Limen verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  limen-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Limen verifies itself with the CLI built from this commit, stamped with
      # the version in package.json — never a hard-coded one. --strict then
      # fails if .echelon/limen.json records any other version, which is how a
      # release that forgets to move the self-installation is caught
      # (test/boundary-rules.test.ts checks the same thing locally).
      - name: Verify the Limen boundary from its source implementation
        run: |
          version="$(node -p "require('./package.json').version")"
          dotnet run --project cli/Limen.Cli/Limen.Cli.fsproj -c Release -p:Version="$version" -- \
            --root "$GITHUB_WORKSPACE" verify --strict --verbose
