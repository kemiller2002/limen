# Installed and maintained by Limen (@echelon-foundry/typescript-wasm-kernel).
# Edit freely — once changed, `limen upgrade` will stop rewriting it and will
# tell you what the current tool-owned version would have been.
name: Limen verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  limen-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify the Limen boundary from its source implementation
        run: |
          dotnet run --project cli/Limen.Cli/Limen.Cli.fsproj -c Release -p:Version=0.6.1 -- \
            --root "$GITHUB_WORKSPACE" verify --strict
