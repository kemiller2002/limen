name: Publish package

# Two ways to cut a release, one publish path:
#
#  1. Push an annotated tag vX.Y.Z (the original path).
#  2. Run "Publish" from the Actions tab on main with the version and the full
#     commit SHA. The `tag` job verifies that commit and pushes the tag with
#     GITHUB_TOKEN; `publish` then publishes from that tag in this same run.
#
# The dispatch path has to live in this file, not a separate workflow: a tag
# pushed by GITHUB_TOKEN never starts another workflow, and npm Trusted
# Publishing trusts this workflow file by name.

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.7.1). Must equal package.json at the commit."
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the commit on main to release."
        required: true
        type: string

permissions: {}

jobs:
  # Dispatch only. Fails closed before anything is tagged or published.
  tag:
    name: Verify the commit and tag it
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: read # find the commit's CI run
      checks: read # read that run's check runs
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require well-formed inputs, dispatched from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not X.Y.Z"
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit '$COMMIT' is not a full lowercase 40-character SHA"
            exit 1
          fi

      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require the commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::$COMMIT is not main or an ancestor of main"
            exit 1
          fi

      - name: Require package.json at the commit to carry the version
        shell: bash
        run: |
          package_version="$(git show "$COMMIT:package.json" | jq -r .version)"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::package.json at $COMMIT is $package_version, not $VERSION"
            exit 1
          fi

      - name: Require CI to have passed on the commit
        shell: bash
        run: |
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty | [.id, .status, (.conclusion // "none"), .check_suite_id] | @tsv')"
          if [[ -z "$run" ]]; then
            echo "::error::no CI push run found for $COMMIT"
            exit 1
          fi
          read -r run_id status conclusion suite_id <<<"$run"
          echo "CI run $run_id: $status/$conclusion"
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::CI run $run_id on $COMMIT is $status/$conclusion, not completed/success"
            exit 1
          fi
          checks="$(gh api --paginate "repos/$GITHUB_REPOSITORY/check-suites/$suite_id/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "none")] | @tsv')"
          echo "$checks"
          if [[ -z "$checks" ]]; then
            echo "::error::CI run $run_id has no check runs"
            exit 1
          fi
          if awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped" && $3 != "neutral")' <<<"$checks" | grep -q .; then
            echo "::error::a CI check run on $COMMIT did not succeed"
            exit 1
          fi

      # Idempotent: a re-run finds the tag it pushed and accepts it, but a tag
      # at any other commit stops the release.
      - name: Create and push the annotated tag
        shell: bash
        run: |
          tag="v$VERSION"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [[ -n "$existing" ]]; then
            target="$(awk -v ref="refs/tags/$tag^{}" '$2 == ref { print $1 }' <<<"$existing")"
            [[ -z "$target" ]] && target="$(awk '{ print $1 }' <<<"$existing" | head -n 1)"
            if [[ "$target" != "$COMMIT" ]]; then
              echo "::error::$tag already exists at $target, not $COMMIT"
              exit 1
            fi
            echo "$tag already exists at $COMMIT; not re-creating it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$COMMIT" -m "Limen $VERSION"
          git push origin "refs/tags/$tag"

  publish:
    needs: tag
    # Runs for a tag push (where `tag` is skipped) or after `tag` succeeds.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.tag.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write # Sigstore build provenance for the F# packages
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # The published package contains a self-contained binary per platform,
      # cross-published from this one runner. Release must never depend on a
      # developer's machine having produced them.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Require tag and package versions to match
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version $package_version does not match tag $RELEASE_TAG"
            exit 1
          fi
          if [[ -n "$RELEASE_COMMIT" && "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            echo "$RELEASE_TAG resolves to $(git rev-parse HEAD), not $RELEASE_COMMIT"
            exit 1
          fi

      - name: Test the lifecycle core
        run: npm run test:cli

      - name: Build the lifecycle CLI for this platform
        run: npm run build:cli

      - name: Build and test
        run: npm run check

      # Build the real archive and exercise it, rather than trusting that the
      # source tree passing means the published package will work.
      #
      # `--pack-destination` does not create the directory: npm opens the
      # tarball path for writing and fails with ENOENT if the parent is
      # missing. That is what broke the v0.5.0 release.
      - name: Pack the release archive
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination ./release

      - name: Verify the packed archive contains every platform binary
        shell: bash
        run: |
          archive="$(ls ./release/*.tgz)"
          echo "Inspecting $archive"
          contents="$(tar -tzf "$archive")"
          echo "$contents"
          for runtime in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            expected="package/runtimes/$runtime/limen"
            [[ "$runtime" == win-* ]] && expected="$expected.exe"
            if ! grep -qx "$expected" <<<"$contents"; then
              echo "missing $expected from the package"
              exit 1
            fi
          done
          if grep -q "package/dist/main\." <<<"$contents"; then
            echo "dist/main.* must not ship"
            exit 1
          fi

      # Install the archive into a throwaway repository and run the documented
      # quick start against it. This is the last gate before publishing.
      - name: Exercise the packed archive as a consumer would
        shell: bash
        run: |
          archive="$(cd release && ls *.tgz)"
          workspace="$(mktemp -d)"
          cp "release/$archive" "$workspace/"
          cd "$workspace"
          git init -q .
          mkdir -p src/engine src/kernel
          echo 'export const add = (a: number, b: number) => a + b;' > src/engine/domain.ts
          echo 'export const mount = () => document.body;' > src/kernel/bridge.ts
          npm init -y > /dev/null
          npm install --no-audit --no-fund "./$archive"
          npx limen --version
          npx limen init
          npx limen init --check
          npx limen status --json > /dev/null
          npx limen verify --strict
          npx limen doctor

      # The library half of the same gate: install the real archive into an
      # empty project and build the documented minimal example against it. The
      # step above proves the CLI works when installed; this proves the package
      # a JavaScript consumer imports does.
      - name: Exercise the packed archive as a library consumer would
        shell: bash
        run: npm run check:clean-room -- --tarball "$(ls ./release/*.tgz)"

      # LCP-044, LCP-079: the F# packages ship in lockstep on the same release,
      # as attested GitHub release assets (the interim NuGet channel Arca and
      # Fides use, DF-ARCA-2026-0006), installed through Conditor's NuGet feed.
      # Packing refuses a missing or mis-versioned package; the clean room
      # proves a consumer built from the files alone. Both before anything is
      # published.
      - name: Pack the F# packages in lockstep and prove them in a clean room
        shell: bash
        run: |
          npm run pack:nuget
          npm run check:nuget

      - name: Attest the F# packages and their checksums (Sigstore build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist-nuget/*.nupkg
            dist-nuget/checksums.txt

      - name: Keep the F# packages for the release job
        uses: actions/upload-artifact@v4
        with:
          name: limen-nuget-${{ env.RELEASE_TAG }}
          path: dist-nuget
          if-no-files-found: error

      # Idempotent: a version already on the registry is left alone, so a
      # re-run after a later step fails does not fail here.
      - name: Publish to npm
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [[ "$(npm view "$name@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "::notice::$name@$version is already published; skipping npm publish"
            exit 0
          fi
          npm publish --access public ./release/*.tgz

  release:
    name: GitHub release
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Fetch the attested F# packages
        uses: actions/download-artifact@v4
        with:
          name: limen-nuget-${{ env.RELEASE_TAG }}
          path: dist-nuget

      - name: Verify the F# packages against their checksums
        working-directory: dist-nuget
        run: sha256sum -c checksums.txt

      # Notes are the version's CHANGELOG section; the F# packages and their
      # checksums are its assets. Idempotent: an existing release keeps its
      # notes, and only assets it lacks are added (a released asset is never
      # replaced).
      - name: Create the GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            present="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for asset in dist-nuget/*.nupkg dist-nuget/checksums.txt; do
              if ! grep -qx "$(basename "$asset")" <<<"$present"; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" dist-nuget/*.nupkg dist-nuget/checksums.txt
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-from-tag dist-nuget/*.nupkg dist-nuget/checksums.txt
          fi

      # What a consumer downloads is what was built and attested: the
      # published assets, fetched back into an empty directory, match their
      # checksums and each carries a build-provenance attestation from this
      # workflow.
      - name: Verify the published assets and their attestations
        shell: bash
        run: |
          check="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$check" --pattern '*.nupkg' --pattern 'checksums.txt'
          (cd "$check" && sha256sum -c checksums.txt)
          for asset in "$check"/*.nupkg "$check"/checksums.txt; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" > /dev/null
            echo "attestation verified: $(basename "$asset")"
          done
