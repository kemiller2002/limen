name: Temporary Limen self reconciliation

on:
  push:
    branches:
      - "chore/echelon-capabilities-2026-09-21"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Start ROS work
        shell: bash
        env:
          ROS_ACTOR: agent:chatgpt
        run: |
          set -euo pipefail
          git fetch origin main
          export ROS_BASE_REF=origin/main
          work_id="LIMEN-UPGRADE-2026-09-21"
          ./ros add "Reconcile Limen self-hosting with current Echelon capabilities" \
            --id "$work_id" \
            --tag tooling,limen,ordo,ros \
            --priority high \
            --source agent-discovery \
            --source-reference "public-repository-upgrade-2026-09-21"
          ready_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./ros work backlog-transition --id "$work_id" --action ready --occurred-at "$ready_at"
          sleep 1
          start_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./ros work start --id "$work_id" --occurred-at "$start_at" --type mechanical --actor agent:chatgpt

      - name: Re-adopt customized Limen self-verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .echelon/limen.json
          dotnet run --project cli/Limen.Cli/Limen.Cli.fsproj -c Release -p:Version=0.6.1 -- \
            --root "$GITHUB_WORKSPACE" init
          dotnet run --project cli/Limen.Cli/Limen.Cli.fsproj -c Release -p:Version=0.6.1 -- \
            --root "$GITHUB_WORKSPACE" verify --strict

      - name: Verify documentation graph
        run: npm run check:docs

      - name: Complete ROS work and validate
        shell: bash
        env:
          ROS_ACTOR: agent:chatgpt
        run: |
          set -euo pipefail
          git fetch origin main
          export ROS_BASE_REF=origin/main
          work_id="LIMEN-UPGRADE-2026-09-21"
          done_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./ros work complete --id "$work_id" --occurred-at "$done_at" --actor agent:chatgpt
          ./ros validate

      - name: Commit reconciled state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset ".github/workflows/limen-self-reconcile.yml"
          if git diff --cached --quiet; then
            echo "No reconciliation state changed."
            exit 0
          fi
          git commit -m "chore: reconcile Limen self-hosting capability state"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
